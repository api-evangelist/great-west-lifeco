- aid: great-west-lifeco:empower-oauth-2-0-api
  name: Empower OAuth 2.0 API
  description: >-
    The authorization API for Empower's API suite, listed as "production" in the
    public Empower developer portal catalog. It generates bearer access tokens
    used to authorize calls to the other Empower APIs. Public release notes on
    the catalog page document /auth and /token endpoints, an optional x-api-key
    header on both, and an invalid_grant 400 response when a requested OAuth
    scope is not configured on the client profile. Empower documents OAuth 2.0
    and OpenID Connect with the client_credentials grant for B2B partner
    integration, and is moving to asymmetric private-key JWT client
    authentication (PKI) in line with Financial-grade API (FAPI) practice.
    Reference documentation is behind login and the authorization service
    endpoint is communicated privately to approved partners. The baseURL below
    is the probe-observed U.S. API gateway host; the authorization service host
    itself is never published.
  humanURL: https://developer.empower.com/api-catalog/oauth2-api
  baseURL: https://api.empower.com
  tags:
  - Authentication
  - Authorization
  - Security
  - OpenID Connect
  - Login Gated
  tags_raw:
  - OAuth
  - Authorization
  - Security
  - OpenID Connect
  - Login Gated
  properties:
  - type: Documentation
    url: https://developer.empower.com/api-catalog/oauth2-api
  - type: Authentication
    url: https://developer.empower.com/docs/additional-security-protocols-publicprivate-key-infrastructure-pki
  - type: ChangeLog
    url: changelog/great-west-lifeco-changelog.yml
    name: Empower OAuth 2.0 API release notes (v2.3.0, v1.3.1)
  - type: OAuthScopes
    url: scopes/great-west-lifeco-scopes.yml
- aid: great-west-lifeco:canada-life-api-gateway
  name: Canada Life API Gateway (OAuth 2.0 / OpenID Connect)
  description: >-
    The production API gateway of Canada Life, Great-West Lifeco's Canadian
    operating brand, at api.canadalife.com. It publishes no documentation, but
    it does serve a real OpenID Connect discovery document anonymously at
    /.well-known/openid-configuration (HTTP 200) - the only machine-readable
    contract published anywhere in the Great-West Lifeco group. The document
    declares issuer https://api.canadalife.com, a token endpoint at
    /oauth2/v1/generate, live JWKS at /oauth2/v1/jwks (HTTP 200), revocation at
    /oauth2/v1/revoke and userinfo at /oauth2/v1/userinfo, with RS256 ID-token
    signing and client_secret_basic / client_secret_post / client_secret_jwt
    client authentication. The authorization endpoint is deliberately published
    as /oauth2/v1/authorize-NOT-SUPPORTED, so the gateway is machine-to-machine
    only, and scopes_supported is an empty array. Anonymous calls to protected
    paths return an Apigee error envelope naming the Consumer-Key and pointing
    to https://apimarketplace.canadalife.com - a digitalML-hosted Canada Life
    API marketplace whose hostname CNAMEs to canadalife.digitalml.com and does
    not resolve on the public internet. Entitlement is therefore partner-only,
    with no public request path.
  humanURL: https://www.canadalife.com/
  baseURL: https://api.canadalife.com
