aid: great-west-lifeco
url: https://raw.githubusercontent.com/api-evangelist/great-west-lifeco/refs/heads/main/apis.yml
name: Great-West Lifeco
kind: company
description: >-
  Great-West Lifeco Inc. is a Winnipeg-headquartered international financial
  services holding company and a member of the Power Corporation group, and one
  of the largest life insurers in North America. It operates through Canada Life
  in Canada, the United Kingdom, the Isle of Man and Germany, through Irish Life
  in Ireland, and through Empower in the United States, spanning individual and
  group life, health and dental, disability and critical illness insurance,
  annuities and payout products, segregated funds and wealth management,
  employer-sponsored retirement recordkeeping, and life reinsurance. Its home
  market is Canada, where it is federally supervised by OSFI for prudential
  matters while market conduct is regulated province by province, and where no
  open-insurance mandate exists (Consumer-Driven Banking excludes insurance
  outright). Its API posture reflects that absence of a forcing function: the
  Great-West Lifeco corporate site and the Canadian consumer site
  canadalife.com publish no developer portal and no API documentation, and
  probes of developer/docs subdomains and /developers, /api, /developer,
  /partners and /integrations paths return no such surface. Two production API
  surfaces nevertheless exist inside the group, both partner-gated and
  unrelated to each other. Canada Life runs an Apigee gateway at
  api.canadalife.com that serves a real OpenID Connect discovery document
  anonymously - issuer, JWKS, token, revocation and userinfo endpoints, with
  the authorization endpoint deliberately published as
  "authorize-NOT-SUPPORTED" and an empty scopes_supported array - and whose
  error envelopes point to https://apimarketplace.canadalife.com, a
  digitalML-hosted API marketplace that does not resolve publicly. The U.S.
  retirement subsidiary Empower runs a genuine developer portal that lists two
  production APIs publicly while naming eight API products plus three coming
  soon on its marketing site, places every piece of reference documentation
  behind login, documents an x-api-key header with OAuth 2.0 client_credentials
  and private_key_jwt in support of FAPI, publishes release notes, a
  maintenance window and a mock-data sandbox, and issues credentials only after
  a reviewed access request. There is no downloadable OpenAPI anywhere, no
  public Postman collection, no SDK, no MCP server, no webhook or event
  catalog, and no ACORD, AL3 or IVANS reference on any public property in the
  group.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
