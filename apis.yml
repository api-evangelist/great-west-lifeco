apis:
- aid: great-west-lifeco:empower-balance-api
  name: Empower Balance API
  description: >-
    Listed in the public API catalog of the Empower developer portal, operated
    by Great-West Lifeco's U.S. retirement subsidiary Empower. Marked
    "production" and categorized "financial", it returns participant-level
    balance data for employer-sponsored retirement plans, including total
    balances, investments, loans and vesting balances, in JSON, for integration
    into Empower client and partner solutions. The catalog page is public and
    states the API was developed following OpenAPI Specification standards, but
    the reference documentation itself is gated ("To see the reference
    documentation, please login") and access is granted only through the portal
    "Get Access" request flow, after which an API key and OAuth client
    credentials are delivered by secure email. No machine-readable
    specification, base URL, or endpoint list is published anonymously.
  humanURL: https://developer.empower.com/api-catalog/balance-api
  tags:
  - Retirement
  - Balances
  - Financial
  - Read Only
  - Login Gated
  properties:
  - type: Documentation
    url: https://developer.empower.com/api-catalog/balance-api
  - type: Documentation
    url: https://developer.empower.com/docs/get-started
- aid: great-west-lifeco:empower-oauth-2-0-api
  name: Empower OAuth 2.0 API
  description: >-
    The authorization API for Empower's API suite, listed as "production" in the
    public Empower developer portal catalog. It generates bearer access tokens
    used to authorize calls to the other Empower APIs. Public release notes on
    the catalog page document /auth and /token endpoints, an optional x-api-key
    header on both, and an invalid_grant 400 response when a requested OAuth
    scope is not configured on the client profile. Empower documents OAuth 2.0
    and OpenID Connect with the client_credentials grant for B2B partner
    integration, and is moving to asymmetric private-key JWT client
    authentication (PKI) in line with Financial-grade API (FAPI) practice.
    Reference documentation is behind login and the authorization service
    endpoint is communicated privately to approved partners.
  humanURL: https://developer.empower.com/api-catalog/oauth2-api
  tags:
  - OAuth
  - Authorization
  - Security
  - OpenID Connect
  - Login Gated
  properties:
  - type: Documentation
    url: https://developer.empower.com/api-catalog/oauth2-api
  - type: Authentication
    url: https://developer.empower.com/docs/additional-security-protocols-publicprivate-key-infrastructure-pki
