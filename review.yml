      - url: https://www.canadalife.com/api
        status: 404
    subsidiaryPortalFound:
      url: https://developer.empower.com/
      status: 200
      classification: real developer portal, publicly readable, but NOT self-serve
      loginWall: false
      selfServe: false
      entity: Empower (U.S. retirement subsidiary of Great-West Lifeco)
      platform: Drupal with Pronovix developer-portal theme; Cognito/SAML federated login
      publiclyReadable:
        - https://developer.empower.com/api-catalog
        - https://developer.empower.com/api-catalog/balance-api
        - https://developer.empower.com/api-catalog/oauth2-api
        - https://developer.empower.com/docs/get-started
        - https://developer.empower.com/docs/go-production
        - https://developer.empower.com/docs/status-and-maintenance
        - https://developer.empower.com/docs/additional-security-protocols-publicprivate-key-infrastructure-pki
        - https://developer.empower.com/support
      gatedBehindLogin:
        - All API reference documentation ("To see the reference documentation, please login")
        - Base URLs and endpoint paths
        - API key, client ID, client secret, authorization service endpoint (emailed after approval)
    otherSubsidiaries:
      - url: https://developer.irishlife.ie/
        status: 000
        note: Irish Life (Ireland). Does not resolve.
      - url: https://api.irishlife.ie/
        status: 000
      - url: https://docs.empower.com/
        status: 200
        note: >-
          NOT API documentation. Serves a legacy "GWRS Webinars" page for
          Great-West Retirement Services. Recorded so it is not mistaken for a
          docs site.
  specifications:
    harvested: 0
    downloadable: false
    note: |
      No OpenAPI, Swagger, AsyncAPI or Postman artifact could be retrieved
      anonymously. The Balance API catalog page states the API was "developed
      following industry Open API Specification standards", but no document is
      served publicly. Spec probes against developer.empower.com all returned
      404 (text/html): /openapi.json, /openapi.yaml, /swagger.json, /api-docs,
      /spec, /redoc, /sitemap.xml, /sites/default/files/openapi.json,
      /api-catalog/balance-api/openapi. The openapi/ directory is therefore
      omitted from this repository rather than filled with anything invented.
  acordPosture:
    posture: no ACORD reference found
    detail: |
      No occurrence of ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic or
      Vertafore was found on greatwestlifeco.com, canadalife.com, or anywhere
      in the public pages of developer.empower.com. Both corporate sitemaps
      were scanned and the Empower portal pages were fetched and grepped
      directly. Consistent with a Canadian life-and-health carrier and a U.S.
      retirement recordkeeper: ACORD's centre of gravity in North America is
      P&C agency download, which is not this group's line of business.
  insuranceVerbs:
    quote: not exposed publicly
    bind: not exposed publicly
    issue: not exposed publicly
    fnol: not exposed publicly
    note: |
      None of the four insurance API verbs is exposed on any public surface in
      the group. The only public API catalog entry with business meaning is a
      read-only retirement balance lookup (Empower Balance API), which is
      partner-facing, not consumer- or agent-facing, and belongs to the U.S.
      retirement business rather than to the Canadian insurance book. Canadian
      group benefits claims flow through incumbent intermediaries and the
      insurer's own portals, not through a documented public API.
  authModel:
    scheme: OAuth 2.0 client_credentials plus API key header, moving to private_key_jwt (PKI)
    documented: true
    documentedAt: https://developer.empower.com/docs/get-started
    detail: |
      Empower documents an API key supplied as the x-api-key request header,
      plus OAuth 2.0 with the client_credentials grant for B2B partner
      integration, exchanged with HTTP Basic (client ID as username, client
      secret as password) at an authorization token endpoint that is
      communicated privately to approved partners. Empower states it uses
      OAuth 2.0 and OpenID Connect, and that from Q4 2024 it requires
      asymmetric public-key client authentication (private_key_jwt) in support
      of Financial-grade API (FAPI) security, with symmetric client_secret
      retained only for read-only APIs on request and after security review.
      B2C scenarios are handled by contacting Empower.
    wellKnownProbes:
      - url: https://developer.empower.com/.well-known/openid-configuration
        status: 404
      - url: https://developer.empower.com/.well-known/oauth-authorization-server
        status: 404
      - url: https://api.empower.com/.well-known/openid-configuration
        status: 403
        note: JSON gateway response; discovery document not served anonymously.
  webhooks:
    published: false
    note: No event catalog, webhook documentation or AsyncAPI was found. Absence is the finding.
  postman:
    publicCollection: false
    note: |
      The Empower getting-started guide illustrates token retrieval with a
      Postman screenshot, but no public Postman collection or workspace is
      linked or published.
  graphql:
    published: false
  grpc:
    published: false
  codeRepositories:
    githubOrganization: none found
    note: |
      github.com/greatwestlifeco returns 404. github.com/empower resolves to an
      unrelated organization named "Empower Campaigns" (empowercampaigns.com)
      and github.com/canadalife is an unrelated individual user account.
      Neither is claimed as a company property.
  transports:
    - protocol: REST
      scheme: https
      documented: partial
      note: >-
        Empower catalog names REST APIs and JSON responses, but base URLs and
        endpoint paths are behind login. api.empower.com answers 403 to
        anonymous requests and is not documented as a public base URL.
    - protocol: WebSocket
      scheme: wss
      documented: false
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
enrichmentRoundTwo:
  date: '2026-07-25'
  note: >-
    Second enrichment pass. Three material corrections to the first-round
    findings, all backed by live probes, plus the artifact set now in this
    repository.
  corrections:
    - finding: Canada Life DOES serve an anonymous machine-readable contract.
      detail: >-
        The first round recorded api.canadalife.com as "403, undocumented, not
        a portal" and moved on. In fact
        https://api.canadalife.com/.well-known/openid-configuration returns
        HTTP 200 with a real OpenID Connect discovery document (issuer,
        /oauth2/v1/generate token endpoint, /oauth2/v1/jwks which itself
        returns live RSA keys at HTTP 200, /oauth2/v1/revoke, /oauth2/v1/userinfo),
        and the authorization endpoint is deliberately published as
        /oauth2/v1/authorize-NOT-SUPPORTED. This is the only machine-readable
        contract published anywhere in the group. Saved verbatim to
        well-known/great-west-lifeco-openid-configuration.json.
    - finding: Canada Life runs a digitalML API marketplace.
      detail: >-
        Every Apigee error envelope from api.canadalife.com carries
        "info": "https://apimarketplace.canadalife.com". That hostname CNAMEs
        to canadalife.digitalml.com (the digitalML ignite platform) but has no
        public A record and does not resolve, so the marketplace is
        internal/partner-only. The gateway also names the "Consumer-Key" in its
        403 body, confirming Apigee, fronted by a Google Cloud load balancer.
    - finding: Empower's API line-up is far larger than the two-entry public catalog.
      detail: >-
        https://www.empower.com/financial-professionals/experience/apis names
        eight API products - DC payroll bundle, DC census/indicative, Financial
        data exchange, DC participant balances, DC deferrals, DC loans, DC
        participant YTD contributions, DC participant eligibility - plus three
        "coming soon" (DC participant personal rate of return, DC plan
        provisions, DC investments). Only DC participant balances (as Balance
        API) and the OAuth 2.0 API surface in the anonymous catalog. The page
        also documents security posture: OWASP API Security guidance, OAuth 2.0
        with OpenID Connect, early adoption of FAPI, and gateway/WAF rate
        limiting, throttling and payload validation.
    - finding: A sandbox exists and was not captured.
      detail: >-
        The Empower get-started guide documents an "api-sandbox" mock-data
        environment every approved partner starts in, plus a separate stage
        environment with production-like data. A publicly reachable sandbox
        instance of the portal runs at https://developer-sandbox.empower.com/
        (HTTP 200) and its catalog carries an extra "test only" category. No
        test credentials or fixture values are published.
    - finding: Published compliance posture was not captured.
      detail: >-
        https://www.empower.com/financial-professionals/about-empower/cybersecurity
        names an "Unqualified SOC 2 Type 2 third-party attestation" and
        cybersecurity policies "aligned with NIST 800-53, NIST CSF, and ISO
        27001", plus SAST/DAST aligned to OWASP, annual independent penetration
        testing, minimum TLS 1.2 in transit and AES-256 at rest.
  confirmed:
    - No OpenAPI, Swagger, GraphQL SDL, gRPC/protobuf, AsyncAPI, MCP server,
      public Postman collection or first-party SDK anywhere in the group.
      Registry searches (npm, PyPI) and GitHub org probes returned nothing
      claimed as a company property; github.com/Empower-Retirement exists but
      is empty (0 public repos, no metadata).
    - No /.well-known/security.txt, no vulnerability disclosure program and no
      bug bounty on any host. probe-security-programs.py returned vdp=none.
    - No deprecation policy, no SLA, no webhook or event surface, no
      idempotency contract, no published rate limits.
    - api.irishlife.ie now has an A record (4.207.220.221, Azure) but no
      listener answers on 443; every request times out.
