      - url: https://developer.greatwestlifeco.com/
        status: 000
        note: Does not resolve.
      - url: https://developers.greatwestlifeco.com/
        status: 000
        note: Does not resolve.
      - url: https://docs.greatwestlifeco.com/
        status: 000
        note: Does not resolve.
      - url: https://api.greatwestlifeco.com/
        status: 000
        note: Does not resolve.
      - url: https://www.greatwestlifeco.com/developers
        status: 404
      - url: https://www.greatwestlifeco.com/api
        status: 404
      - url: https://www.greatwestlifeco.com/developer
        status: 404
      - url: https://www.greatwestlifeco.com/partners
        status: 404
      - url: https://www.greatwestlifeco.com/integrations
        status: 404
    canadianOperatingBrand:
      - url: https://www.canadalife.com/
        status: 200
        note: Canadian insurance and wealth brand. No developer or API content.
      - url: https://developer.canadalife.com/
        status: 000
      - url: https://developers.canadalife.com/
        status: 000
      - url: https://docs.canadalife.com/
        status: 000
