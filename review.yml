aid: great-west-lifeco
name: Great-West Lifeco
review:
  question: >-
    Does Great-West Lifeco expose a real, public, self-serve developer portal
    and downloadable API specifications for its insurance business?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  gated: true
findings:
  summary: |
    Great-West Lifeco, the holding company, publishes no developer surface of
    its own, and neither does Canada Life, its Canadian operating brand and the
    entity that actually writes insurance in the home market. Every first-party
    probe against greatwestlifeco.com and canadalife.com failed: the
    developer/developers/docs subdomains do not resolve, and the /developers,
    /api, /developer, /partners and /integrations paths all return 404. The
    full public English sitemaps for both sites (273 KB for canadalife.com,
    129 KB for greatwestlifeco.com) contain no API, developer, integration or
    ACORD page of any kind. This is the expected shape for a Canadian carrier:
    OSFI supervises prudentially, provincial regulators (FSRA, AMF) handle
    market conduct, there is no open-insurance mandate, and Consumer-Driven
    Banking explicitly excludes insurance, so nothing forces a public API.

    The one real developer surface anywhere in the group belongs to Empower,
    Great-West Lifeco's U.S. retirement recordkeeping subsidiary (formerly
    Great-West Life & Annuity). https://developer.empower.com/ returns HTTP 200
    and is a genuine developer portal — a Drupal/Pronovix build with a publicly
    readable API catalog, getting-started guides, a documented authentication
    model, a status-and-maintenance page, release notes and a support flow. It
    is not a marketing page and it is not a bare login wall. It is, however,
    not self-serve: the two catalog entries state "To see the reference
    documentation, please login", and keys are issued only after a "Get Access"
    request is reviewed, with the API key, client ID, client secret and
    authorization service endpoint delivered afterwards by secure email. No
    anonymous visitor can retrieve an endpoint list, a base URL, or a
    specification. Note also that this surface is U.S. retirement plan data,
    not Canadian insurance — the Canadian book has no public API at all.
