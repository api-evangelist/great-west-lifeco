- api: Empower OAuth 2.0 API
  version: 1.3.1
  date: null
  breaking: false
  additions:
  - /token and /auth endpoint accept optional x-api-key http header.
  changes:
  - >-
    /token endpoint can result 400 status code with "invalid_grant" error
    message if requested oauth scope is not configured in oauth client profile.
  highlights: >-
    Documents the API-key header as optional on both OAuth endpoints and the
    invalid_grant failure mode for unconfigured scopes - the only published
    evidence that Empower enforces a scope vocabulary.
